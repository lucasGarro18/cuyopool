<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Página no encontrada — Cuyo Pool</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#eaf6f7;--ink-dim:rgba(234,246,247,.68);--accent:#cfe9e8;--gold:#d8bd86;--bg:#03131e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:22px;text-align:center;padding:24px;color:var(--ink);
       background:var(--bg);
       background-image:radial-gradient(ellipse at 50% 28%, #0d4759 0%, #062436 55%, #03131e 100%);
       font-family:'Inter Tight',system-ui,sans-serif;font-weight:300}
  .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(90px,18vw,150px);
       line-height:1;color:var(--accent);opacity:.9}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(22px,4.5vw,32px)}
  p{color:var(--ink-dim);max-width:44ch}
  a.btn{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:14px 26px;
       border:1px solid var(--gold);border-radius:999px;color:var(--ink);text-decoration:none;
       font-size:12px;letter-spacing:.22em;text-transform:uppercase;transition:background .3s,color .3s}
  a.btn:hover{background:var(--gold);color:var(--bg)}
</style>
</head>
<body>
  <div class="num">404</div>
  <h1>Esta página se nos escurrió como el agua.</h1>
  <p>La dirección que buscás no existe o cambió de lugar. Volvé al inicio para ver nuestras piscinas de autor.</p>
  <a class="btn" href="/cuyopool/">Volver al inicio</a>
</body>
</html>
